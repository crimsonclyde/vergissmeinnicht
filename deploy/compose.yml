# VergissMeinNicht production deployment (docu/deployment.md, steps.md 10.1).
#
#   cp vergissmeinnicht.env.example vergissmeinnicht.env   # then edit
#   mkdir -p secrets && openssl rand -base64 32 > secrets/auth_secret \
#     && openssl rand -base64 32 > secrets/data_encryption_key && chmod 0400 secrets/*
#   VMN_DOMAIN=vmn.example.org docker compose up -d --build   # first start
#   docker compose run --rm app migrate                        # before every (re)start with a new version
#
# The app is reachable only through Caddy (HTTPS, automatic certificates). Caddy has a fixed address
# on an internal network, and only that address may set X-Forwarded-For (TRUSTED_PROXIES).
name: vergissmeinnicht

services:
  app:
    image: ${VMN_IMAGE:-vergissmeinnicht:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # A ceiling for the whole application: reading one PDF for its previews can take up to about
    # 2.4 GB for a moment (docu/deployment.md "Memory"). 4 GiB leaves room for everything else; swap
    # is not added on top. If the limit is ever reached the container is restarted (`restart`).
    mem_limit: 4g
    memswap_limit: 4g
    env_file: vergissmeinnicht.env
    environment:
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
      TRUSTED_PROXIES: 172.31.250.2
    secrets: [auth_secret, data_encryption_key]
    volumes:
      - data:/data
    networks: [internal]
    # No published ports: the app is only reachable through the reverse proxy.

  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    depends_on: [app]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      VMN_DOMAIN: ${VMN_DOMAIN:?Set VMN_DOMAIN to the public host name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      internal:
        ipv4_address: 172.31.250.2

networks:
  internal:
    ipam:
      config:
        - subnet: 172.31.250.0/24
          # Dynamic addresses (app, one-off `run` containers) never collide with Caddy's fixed one.
          ip_range: 172.31.250.128/25

secrets:
  auth_secret:
    file: ./secrets/auth_secret
  data_encryption_key:
    file: ./secrets/data_encryption_key

volumes:
  # SQLite database, its WAL files and backups (/data/backups): sensitive, back it up (docu/deployment.md).
  data:
  caddy_data:
  caddy_config:
