version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Security-sensitive upgrades (auth, DB, HTTP) still need explicit review (docs/development/security.md §10).
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Base image of the production Dockerfile (pinned by digest).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # Reverse-proxy image in the Compose deployment.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
