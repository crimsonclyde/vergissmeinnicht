name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the full checks before publishing an image.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # test:e2e already builds the production web assets; no duplicate build.
      - run: pnpm test:e2e

  image:
    # The production image must keep building and running on both architectures (native runners, no
    # emulation), and must not ship known fixable HIGH/CRITICAL vulnerabilities.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag vergissmeinnicht:ci .
      - name: Image runs as non-root and fails closed without configuration
        run: |
          test "$(docker run --rm --entrypoint id vergissmeinnicht:ci -u)" = "1000"
          if docker run --rm vergissmeinnicht:ci serve; then echo "started without configuration" && exit 1; fi
      - name: Smoke test (migrate, CLI, backup, server ready)
        run: deploy/smoke-test.sh vergissmeinnicht:ci
      # Pinned to a verified commit of v0.36.0 (released after the March 2026 tag compromise), with an
      # explicit scanner version.
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vergissmeinnicht:ci
          version: v0.70.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  # Preserve one fail-closed overall status: faster feedback must not bypass browser or image checks.
  check:
    needs: [quality, browser, image]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Every validation job succeeded
        env:
          QUALITY: ${{ needs.quality.result }}
          BROWSER: ${{ needs.browser.result }}
          IMAGE: ${{ needs.image.result }}
        run: test "$QUALITY" = success && test "$BROWSER" = success && test "$IMAGE" = success
