name: Release

# Publishes the production image to GitHub Container Registry when a version tag (v1.2.3) is pushed.
# Nothing is published otherwise. Every architecture is built natively, smoke-tested and scanned
# before it is pushed; the multi-architecture image is signed keyless with Sigstore and carries an
# SBOM attestation.
on:
  push:
    # Releases (v1.2.3) and pre-releases (v0.1.0-beta.1, v1.0.0-rc.2). Pre-releases only get their
    # exact version tag, never `latest` or the minor tag.
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A release commit is pushed to main and tagged together, so CI on main already checks this exact
  # commit. Wait for that run and reuse its result instead of repeating it. Only a successful push run
  # of ci.yml for this same commit counts; otherwise (failed, cancelled, none, tag not on main) the
  # full checks run here.
  ci-status:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.wait.outputs.passed }}
    steps:
      - name: Wait for CI on this commit
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=false
          for i in $(seq 1 70); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=20" \
              --jq '[.workflow_runs[] | {status, conclusion}]')"
            if jq -e 'any(.[]; .conclusion == "success")' <<<"$runs" >/dev/null; then passed=true; break; fi
            # Give the main push a few minutes to start its run; stop once every run has finished.
            if jq -e 'length == 0' <<<"$runs" >/dev/null && [ "$i" -gt 6 ]; then break; fi
            if jq -e 'length > 0 and all(.[]; .status == "completed")' <<<"$runs" >/dev/null; then break; fi
            sleep 30
          done
          echo "CI on main passed for $GITHUB_SHA: $passed"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

  checks:
    needs: ci-status
    if: needs.ci-status.outputs.passed != 'true'
    uses: ./.github/workflows/ci.yml

  image:
    needs: [ci-status, checks]
    # Runs only after CI passed: either on main for this commit, or in the checks job above.
    if: >-
      !cancelled() && needs.ci-status.result == 'success' &&
      (needs.ci-status.outputs.passed == 'true' || needs.checks.result == 'success')
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name and version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: >-
          docker build
          --build-arg "VMN_VERSION=${{ steps.meta.outputs.version }}"
          --label "org.opencontainers.image.version=${{ steps.meta.outputs.version }}"
          --label "org.opencontainers.image.revision=${GITHUB_SHA}"
          --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
          --tag "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}" .
      - name: Smoke test
        run: deploy/smoke-test.sh "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}"
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}
          version: v0.70.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push architecture image
        run: docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}"

  publish:
    needs: image
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Keyless signing: a short-lived certificate for this workflow run (Sigstore / Fulcio).
      id-token: write
    steps:
      - name: Image name and version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Multi-architecture image (version; releases also minor and latest)
        id: manifest
        run: |
          image="${{ steps.meta.outputs.image }}"
          version="${{ steps.meta.outputs.version }}"
          tags=(--tag "$image:$version")
          if [ "${{ steps.meta.outputs.prerelease }}" = "false" ]; then
            tags+=(--tag "$image:${{ steps.meta.outputs.minor }}" --tag "$image:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$image:$version-amd64" "$image:$version-arm64"
          digest="$(docker buildx imagetools inspect "$image:$version" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.manifest.outputs.digest }}
          version: v0.70.0
          format: cyclonedx
          output: sbom.cdx.json
          scan-type: image
      - name: Sign and attest (keyless)
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.manifest.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Verify exact published image and populated upgrade
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.manifest.outputs.digest }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker pull "$REF"
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$REF")" = "$VERSION"
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$REF")" = "$GITHUB_SHA"
          deploy/smoke-test.sh "$REF"
          # The last three published releases (newest first: 0.13.8, 0.13.7, 0.13.6) and one long jump
          # from 0.10.1-beta.0. Add the new predecessor at the top and drop the oldest of the three.
          deploy/upgrade-check.sh "$REF" ghcr.io/crimsonclyde/vergissmeinnicht@sha256:7b3bd3a33dca38b243442994de8caa3096f88a4ae7fdfa7cdd73f3ea339d996c
          deploy/upgrade-check.sh "$REF" ghcr.io/crimsonclyde/vergissmeinnicht@sha256:5e66a45edfd6cf82bd0f16b6bfc2f65d54f921a5b62cd9c606462838314576c3
          deploy/upgrade-check.sh "$REF" ghcr.io/crimsonclyde/vergissmeinnicht@sha256:bff4da8fe2b3c11d918aaf55a84d6ed4f88c7ffe49f31c1ab1a4efe349628c83
          deploy/upgrade-check.sh "$REF" ghcr.io/crimsonclyde/vergissmeinnicht@sha256:1b7b677df1d5cab8cb754d8aabfdf900874d535ca78caf6b74761e4888770976
