packages:
  - apps/*
  - packages/*

# Supply-chain hardening (docs/development/security.md §10).
# Only explicitly reviewed packages may run install scripts.
allowBuilds:
  better-sqlite3: true
  esbuild: true
# Do not install versions published less than 24 hours ago.
minimumReleaseAge: 1440
# Fail if a package's publish trust level drops compared to earlier releases.
trustPolicy: no-downgrade
# Reviewed exceptions (exact versions only):
# - semver@6.3.1: 2023 backport release of the 6.x line published without provenance after
#   7.x gained it; flagged as a trust downgrade by publish date only. Pulled in via Babel.
trustPolicyExclude:
  - semver@6.3.1
strictDepBuilds: true
savePrefix: ''

# Reviewed dependency security fixes (2026-10-28). Keep the existing major lines.
overrides:
  ip-address@10: 10.7.5
  fast-uri@3: 3.1.9
  fast-uri@4: 4.2.3
  nodemailer@10: 10.2.1
  '@esbuild-kit/core-utils>esbuild': 0.25.12
